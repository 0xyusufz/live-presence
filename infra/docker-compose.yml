services:
  coturn:
    image: coturn/coturn:4.6
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped
    command:
      - --listening-port=3478
      - --tls-listening-port=5349
      - --listening-ip=0.0.0.0
      - --realm=${TURN_REALM:?TURN_REALM is required}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      - --min-port=49160
      - --max-port=49200
      - --user-quota=12
      - --total-quota=120
      - --max-bps=10000000
      - --no-multicast-peers
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP is required}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
